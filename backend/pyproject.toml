[project]
name = "agentic-quickapp-backend"
version = "0.1.0"
description = "Backend skeleton for agentic AI quickapp template"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0",
    "openai>=2.45.0",
    "httpx>=0.28.1",
    "duckduckgo-search>=8.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
